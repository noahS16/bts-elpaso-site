<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BTS Arirang in EL Paso</title>
    <link rel="stylesheet" href="/src/styles/style.css">
</head>

<body class="font-solano font-bold ">
    <header class="w-full absolute top-0 left-0 flex justify-end p-4 z-20">
        <!-- List/Hamburger Icon -->
        <div class="relative">
            <button id="menuButton" class="p-2 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="black"
                    stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>
    <!-- Menu -->
    <div id="dropdownMenu"
        class="text-4xl fixed top-0 right-0 h-full w-64 bg-white/90 shadow-lg transform translate-x-full transition-transform duration-300 z-20">
        <a href="/about/" class="block px-4 py-2 hover:bg-gray-100">ABOUT EL PASO</a>
        <a href="/food/" class="block px-4 py-2 hover:bg-gray-100">FOOD</a>
        <a href="/things-to-do/" class="block px-4 py-2 hover:bg-gray-100">THINGS TO DO</a>
        <a href="/nightlife/" class="block px-4 py-2 hover:bg-gray-100">NIGHTLIFE</a>
        <a href="/armymap/" class="block px-4 py-2 hover:bg-gray-100">MA CITY</a>
        <a href="/events/" class="block px-4 py-2 hover:bg-gray-100">MEETUPS/EVENTS</a>
        <a href="/" class="block px-4 py-2 hover:bg-gray-100">HOME</a>
    </div>
    <!-- Overlay for clicking outside -->
    <div id="overlay" class="fixed inset-0 bg-black/30 hidden z-10"></div>

    <main class="flex flex-col items-center bg-[var(--brand-primary)]">
        <img src="/utils/images/homepage.jpg" alt="BTS Arirang in El Paso" class="max-w-full h-auto" />
        <div class="w-full flex flex-col items-center mt-5 gap-5">

            <div id="dayOneCard"
                class="backdrop-blur-sm bg-purple-300 rounded-xl shadow-lg p-4 w-[90%] max-w-sm text-center">

                <div class="text-3xl uppercase tracking-wider mb-2">
                    Days Until arirang in el paso day one!
                </div>

                <div class="grid grid-cols-4 gap-3">
                    <div>
                        <div id="days" class="text-4xl">0</div>
                        <div class="text-sm text-gray-500">Days</div>
                    </div>
                    <div>
                        <div id="hours" class="text-4xl">0</div>
                        <div class="text-sm text-gray-500">Hours</div>
                    </div>
                    <div>
                        <div id="minutes" class="text-4xl">0</div>
                        <div class="text-sm text-gray-500">Min</div>
                    </div>
                    <div>
                        <div id="seconds" class="text-4xl">0</div>
                        <div class="text-sm text-gray-500">Sec</div>
                    </div>
                </div>
            </div>
            <div id="dayTwoCard"
                class="bg-purple-300 backdrop-blur-sm rounded-xl shadow-lg p-4 w-[90%] max-w-sm text-center">

                <div class="text-3xl uppercase tracking-wider mb-2">
                    Days Until Arirang in el paso day two!
                </div>

                <div class="grid grid-cols-4 gap-3">
                    <div>
                        <div id="daysTwo" class="text-4xl">0</div>
                        <div class="text-sm text-gray-500">Days</div>
                    </div>
                    <div>
                        <div id="hoursTwo" class="text-4xl">0</div>
                        <div class="text-sm text-gray-500">Hours</div>
                    </div>
                    <div>
                        <div id="minutesTwo" class="text-4xl">0</div>
                        <div class="text-sm text-gray-500">Min</div>
                    </div>
                    <div>
                        <div id="secondsTwo" class="text-4xl">0</div>
                        <div class="text-sm text-gray-500">Sec</div>
                    </div>
                </div>
            </div>
            <div class="w-full h-20 overflow-hidden">
                <img src="/utils/images/homepage2.png" class="w-full h-full object-cover object-bottom" />
            </div>
        </div>

    </main>

    <footer class="bg-white-100 mt-0">
        <div class="max-w-5xl mx-auto px-4 py-1 pb-3 flex flex-col items-center gap-2 text-center">
            <div class="w-full h-px bg-gray-300"></div>
            <p class="text-gray-600">
                Designed & Developed by
                <span class="font-semibold">Noah</span> &
                <span class="font-semibold">Nadia Saenz</span>
                &copy; 2026
            </p>
            <div class="flex gap-4 mt-1">
                <div class="flex flex-col items-center text-xs text-gray-500">
                    <a href="https://www.instagram.com/nerdiia?igsh=MWJ2a3Vjc3A3N3pibw==" target="_blank"
                        aria-label="Nadia Instagram" class="hover:opacity-70 transition">
                        <img src="/utils/icons/instagram.svg" alt="" class="w-5 h-5" />
                    </a>
                    <span>Nadia</span>
                </div>
                <div class="flex flex-col items-center text-xs text-gray-500">
                    <a href="https://www.instagram.com/noa_saenz?igsh=eW1oeXpvYjZiaXh5&utm_source=qr" target="_blank"
                        aria-label="Noah Instagram" class="hover:opacity-70 transition">
                        <img src="/utils/icons/instagram.svg" alt="" class="w-5 h-5" />
                    </a>
                    <span>Noah</span>
                </div>
            </div>

        </div>
    </footer>
    <script src="/main.js" type="module"></script>
</body>

</html>
